name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint, and build APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Setup CI Firebase stub if needed
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "demo-ci", "storage_bucket": "demo-ci.appspot.com" },
            "client": [
              { "client_info": { "mobilesdk_app_id": "1:123456789:android:abcdef0123456789", "android_client_info": { "package_name": "id.or.karangtaruna" } }, "oauth_client": [], "api_key": [{ "current_key": "ci-build-only-key" }], "services": {} },
              { "client_info": { "mobilesdk_app_id": "1:123456789:android:abcdef0123456780", "android_client_info": { "package_name": "id.or.karangtaruna.debug" } }, "oauth_client": [], "api_key": [{ "current_key": "ci-build-only-key" }], "services": {} }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Android lint
        run: ./gradlew --no-daemon lintDebug
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Assemble release candidate
        run: ./gradlew --no-daemon assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: karangtaruna-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: karangtaruna-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
