name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint, and build APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Setup CI Firebase stub if needed
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "123456789", "project_id": "demo-ci", "storage_bucket": "demo-ci.appspot.com" },
            "client": [
              { "client_info": { "mobilesdk_app_id": "1:123456789:android:abcdef0123456789", "android_client_info": { "package_name": "id.or.karangtaruna" } }, "oauth_client": [], "api_key": [{ "current_key": "ci-build-only-key" }], "services": {} },
              { "client_info": { "mobilesdk_app_id": "1:123456789:android:abcdef0123456780", "android_client_info": { "package_name": "id.or.karangtaruna.debug" } }, "oauth_client": [], "api_key": [{ "current_key": "ci-build-only-key" }], "services": {} }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
      - name: Restore release keystore from secrets if configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/keystore"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/keystore/release.keystore"
            cat << EOF > keystore.properties
          storeFile=$HOME/keystore/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "Configured release keystore from GitHub Secrets. Debug and release APKs use the same signing key."
          else
            echo "Release signing secrets are not configured; using an ephemeral CI key for this run only."
          fi
      - name: Generate CI keystore when release signing not configured
        run: |
          if [ ! -f keystore.properties ]; then
            keystore="$HOME/keystore/ci-ephemeral.keystore"
            mkdir -p "$HOME/keystore"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=KarangTaruna CI, OU=CI, O=CI" -storepass ci-ci-ci-ci -keypass ci-ci-ci-ci
            cat << EOF > keystore.properties
          storeFile=$keystore
          storePassword=ci-ci-ci-ci
          keyAlias=ci
          keyPassword=ci-ci-ci-ci
          EOF
          fi
          if [ ! -f keystore.properties ]; then exit 1; fi
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Android lint
        run: ./gradlew --no-daemon lintDebug
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Assemble release candidate
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify APK signatures
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print -exec keytool -printcert -jarfile {} \; 2>&1 | head -80 || true
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: karangtaruna-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: karangtaruna-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
